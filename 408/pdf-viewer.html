<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智镜 408 · PDF 原页</title>
  <link rel="stylesheet" href="./assets/css/pdf-viewer.css?v=d62c72a0b6c1">
</head>
<body>
  <header class="pdf-toolbar" aria-label="PDF 阅读工具">
    <div class="pdf-page-controls">
      <button id="previous" type="button" disabled aria-label="上一页">‹</button>
      <form id="page-form">
        <label for="page-number">第</label>
        <input id="page-number" type="number" inputmode="numeric" min="1" value="1" aria-label="PDF 页码" disabled>
        <span id="page-total">/ … 页</span>
        <button type="submit" id="jump" disabled>跳转</button>
      </form>
      <button id="next" type="button" disabled aria-label="下一页">›</button>
    </div>
    <div class="pdf-zoom-controls">
      <button id="zoom-out" type="button" disabled aria-label="缩小">−</button>
      <output id="zoom-level" aria-live="polite">100%</output>
      <button id="zoom-in" type="button" disabled aria-label="放大">＋</button>
      <button id="fit-width" type="button" disabled>适应宽度</button>
      <a id="original" target="_blank" rel="noopener">打开原文件 ↗</a>
    </div>
  </header>
  <main id="pdf-scroll" aria-label="PDF 原页内容">
    <p id="status" role="status" aria-live="polite">正在加载 PDF…</p>
    <div id="canvas-wrapper"><canvas id="pdf-canvas" hidden></canvas></div>
  </main>
  <script type="module" src="./assets/js/pdf-viewer.mjs?v=d62c72a0b6c1"></script>
</body>
</html>
